services:
  wizard-youtube-music:
    image: ghcr.io/humanitylabs-org/wizard-youtube-music:sha-855cc53daedaf62e4c09bf06a18603b1c72037a0@sha256:00d8350bd11fa97b408c3956f5c15c659dfdc7ec54523093504df50ded93a32f
    restart: unless-stopped
    user: 1000:1000
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    environment:
      PORT: '9206'
      DATA_DIR: /data
      WIZARD_TRUSTED_ORIGINS: ${WIZARD_TRUSTED_ORIGINS:-}
      WIZARD_RELAY_IMPORT_ORIGIN: ${WIZARD_RELAY_IMPORT_ORIGIN:-}
    volumes:
      - ${APP_DATA_DIR}/data:/data
    ports: ['127.0.0.1:${APP_PORT:-9206}:9206']
    x-runtipi:
      is_main: true
      internal_port: 9206
x-runtipi:
  schema_version: 2
  overrides: []
