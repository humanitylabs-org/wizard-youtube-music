services:
  wizard-youtube-music:
    image: ghcr.io/humanitylabs-org/wizard-youtube-music:sha-29d676d5ced28cf0fa7d82806976fc76d928b00c@sha256:81b912284c57927980b7cd616483bfd9e2efb560cad0e8977231a6912e35b2ad
    restart: unless-stopped
    user: 1000:1000
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    environment:
      PORT: '9206'
      DATA_DIR: /data
      WIZARD_TRUSTED_ORIGINS: ${WIZARD_TRUSTED_ORIGINS:-}
      WIZARD_RELAY_IMPORT_ORIGIN: ${WIZARD_RELAY_IMPORT_ORIGIN:-}
    volumes:
      - ${APP_DATA_DIR}/data:/data
    ports: ['127.0.0.1:${APP_PORT:-9206}:9206']
    x-runtipi:
      is_main: true
      internal_port: 9206
x-runtipi:
  schema_version: 2
  overrides: []
