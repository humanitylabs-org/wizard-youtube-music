services:
  wizard-youtube-music:
    image: ghcr.io/humanitylabs-org/wizard-youtube-music:sha-c0ebe5dde2049d24ffb499b73625fc2b6141b0dd@sha256:49d82faa1097ce8223c63c82f133df9c5a2329e1e9684a1cf9d10802183847fe
    restart: unless-stopped
    user: 1000:1000
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    environment:
      PORT: '9206'
      DATA_DIR: /data
      WIZARD_TRUSTED_ORIGINS: ${WIZARD_TRUSTED_ORIGINS:-}
      WIZARD_RELAY_IMPORT_ORIGIN: ${WIZARD_RELAY_IMPORT_ORIGIN:-}
    volumes:
      - ${APP_DATA_DIR}/data:/data
    ports: ['127.0.0.1:${APP_PORT:-9206}:9206']
    x-runtipi:
      is_main: true
      internal_port: 9206
x-runtipi:
  schema_version: 2
  overrides: []
