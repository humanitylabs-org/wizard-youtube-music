services:
  wizard-youtube-music:
    image: ghcr.io/humanitylabs-org/wizard-youtube-music:sha-1a9e3b5059b51cb66b05b4875e95fab52c6e243b@sha256:23172bcacf7b7ff037065472771291f6ca7cdc8e014f4dae620f6f21a1f3ac5a
    restart: unless-stopped
    user: 1000:1000
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    environment:
      PORT: '9206'
      DATA_DIR: /data
      WIZARD_TRUSTED_ORIGINS: ${WIZARD_TRUSTED_ORIGINS:-}
      WIZARD_RELAY_IMPORT_ORIGIN: ${WIZARD_RELAY_IMPORT_ORIGIN:-}
    volumes:
      - ${APP_DATA_DIR}/data:/data
    ports: ['127.0.0.1:${APP_PORT:-9206}:9206']
    x-runtipi:
      is_main: true
      internal_port: 9206
x-runtipi:
  schema_version: 2
  overrides: []
